<style>
:root{--bg:#11141a;--card:#1b2029;--line:#2a313d;--txt:#e8eaed;--mut:#9aa3af;--acc:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:12px;font-size:15px;font-weight:600}
.tabs button.on{background:var(--acc);color:#06210f;border-color:var(--acc)}
.banner{margin:10px;padding:10px 12px;border-radius:12px;background:#2a2110;color:#fcd34d;font-size:14px;border:1px solid #4a3a12}
main{padding:0 10px 20px}
h2{font-size:20px;margin:14px 2px 4px}.sub{color:var(--mut);font-size:13px;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sub button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:10px;padding:6px 10px;font-size:13px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:16px 2px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;display:grid;grid-template-columns:44px 1fr;gap:10px}
.card.done{opacity:.45}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--acc);font-size:24px;font-weight:700}
.card.done .chk{background:var(--acc);border-color:var(--acc);color:#06210f}
.nm{font-size:17px;font-weight:700}.side{font-size:13px;color:var(--acc);font-weight:600;margin-left:6px}
.tmp{display:inline-block;font-size:11px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:2px}
.rx{font-size:15px;margin-top:2px}.rest{color:var(--mut);font-size:13px}
.cue{color:var(--mut);font-size:14px;margin-top:4px}
.vid{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;background:#b91c1c;color:#fff;text-decoration:none;font-size:18px;font-weight:700}
.vid:active{filter:brightness(.85)}.novid{grid-column:1/-1;color:var(--mut);font-size:13px;text-align:center}
footer{color:var(--mut);font-size:12px;text-align:center;padding:16px}
</style></head><body>

const $=s=>document.querySelector(s);
const today=new Date(); const dayKey=today.toLocaleDateString('sv');
const store=JSON.parse(localStorage.getItem('gymdone')||'{}');
if(store.day!==dayKey){store.day=dayKey;store.done={};}
const save=()=>localStorage.setItem('gymdone',JSON.stringify(store));
const wd=(today.getDay()+6)%7; // lunes=0
let cur=(DATA.routines.find(r=>r.weekday===wd)||DATA.routines.find(r=>r.key==='CASA')||DATA.routines[0]).key;
const h=location.hash.slice(1); if(DATA.routines.some(r=>r.key===h)) cur=h;
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rest(s){if(!s)return'';return s>=60?`Descanso ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:`Descanso ${s} s`}
function render(){
  $('#tabs').innerHTML=DATA.routines.map(r=>`<button class="${r.key===cur?'on':''}" data-k="${r.key}">${esc(r.label)}</button>`).join('');
  const r=DATA.routines.find(x=>x.key===cur); let sec='', out=`<h2>${esc(r.title)}</h2><div class="sub"><span>${r.exercises.length} ejercicios</span><button id="reset">Reiniciar ✓</button></div>`;
  r.exercises.forEach((e,i)=>{
    if(e.section!==sec){sec=e.section;if(sec)out+=`<h3>${esc(sec)}</h3>`}
    const id=r.key+':'+i, done=store.done[id];
    out+=`<div class="card ${done?'done':''}" data-id="${id}"><button class="chk" aria-label="hecho">${done?'✓':''}</button><div>
      <div class="nm">${esc(e.name)}${e.side?`<span class="side">${e.side}</span>`:''}${e.temp?'<span class="tmp">TEMP</span>':''}</div>
      <div class="rx">${esc(e.prescription)} <span class="rest">${rest(e.rest_seconds)}</span></div>
      ${e.cue?`<div class="cue">${esc(e.cue)}</div>`:''}</div>
      ${e.video?`<a class="vid" href="${esc(e.video)}" target="_blank" rel="noopener">▶ Video</a>`:'<div class="novid">sin video</div>'}</div>`;
  });
  $('#main').innerHTML=out; location.hash=cur;
}
$('#tabs').onclick=e=>{const k=e.target.dataset.k;if(k){cur=k;render();scrollTo(0,0)}};
$('#main').onclick=e=>{
  if(e.target.id==='reset'){Object.keys(store.done).filter(k=>k.startsWith(cur+':')).forEach(k=>delete store.done[k]);save();render();return}
  const b=e.target.closest('.chk'); if(!b)return; const id=b.closest('.card').dataset.id;
  store.done[id]=!store.done[id]; save(); render();
};
$('#banner').textContent=DATA.banner;
$('#foot').textContent='actualizado '+DATA.updated;
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
